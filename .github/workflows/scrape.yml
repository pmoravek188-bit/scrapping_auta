name: Scrape

concurrency:
  group: scrape
  cancel-in-progress: false

on:
  schedule:
    # Three times a day: 05:00, 11:00, 17:00 UTC (07:00/13:00/19:00 Prague
    # summer time). Also keeps the Supabase free-tier project active (it
    # pauses after 7 days idle). The e-mail digest itself only ever reports
    # matches that are new since the last notification (see
    # `notifyNewMatches` in packages/scrapers/src/runner.ts, which only
    # selects `matches` rows with `notified_at is null`) — running more often
    # just shortens the delay before a new match is reported, it never
    # resends anything already notified, so this can't spam 3 full digests a
    # day, only up to 3 *when there actually are new matches*.
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Only run this source id (leave empty to run all enabled sources)"
        required: false
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY not set — skipping scrape run. See README for setup."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.skip == 'false'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Run scraper
        if: steps.check.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          SOURCE_INPUT: ${{ inputs.source }}
        run: |
          if [ -n "$SOURCE_INPUT" ]; then
            pnpm scrape -- "--source=$SOURCE_INPUT"
          else
            pnpm scrape
          fi
